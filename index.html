<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Seats" />
  <link rel="apple-touch-icon" href="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=Seats" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Request App</title>

  <!-- Firebase Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-yellow: #FFCC00;
      --text-black: #000000;
      --btn-bg: #000000;
      --btn-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-yellow);
      color: var(--text-black);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-yellow);
      border-radius: 20px;
      border: 3px solid var(--text-black);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .header {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: var(--bg-yellow);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--text-black);
    }

    .header h1 {
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: var(--text-black);
      text-transform: uppercase;
      font-weight: 800;
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 6px;
      background: var(--text-black);
      width: 0%;
      transition: width 0.1s linear;
    }

    .info-badges-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .date-badge {
      text-align: center;
      background: var(--bg-yellow);
      color: var(--text-black);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 800;
      border: 2px solid var(--text-black);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .seats-card {
      text-align: center;
      padding: 24px 16px;
      border-radius: 16px;
      background: var(--bg-yellow);
      border: 3px solid var(--text-black);
      transition: all 0.3s ease;
    }

    .seats-count {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
      color: var(--text-black);
    }

    .seats-label {
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-black);
    }

    .seats-card.booked {
      border-color: var(--text-black);
      background: #fef08a;
    }

    .booked .seats-label {
      color: #b45309;
      font-size: 1.1rem;
    }

    .passenger-controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .counter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-weight: 800;
      color: var(--text-black);
    }

    .btn-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--text-black);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-circle:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--text-black);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 0.1s ease;
    }

    .btn:active { transform: scale(0.98); }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .qr-section {
      text-align: center;
      border-top: 2px solid var(--text-black);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .qr-card {
      background: #FFFFFF;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid var(--text-black);
      display: inline-block;
    }

    .qr-card img {
      display: block;
      width: 140px;
      height: 140px;
    }

    /* FULL-SCREEN DRIVER MODAL OVERLAY */
    .modal-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: var(--bg-yellow) !important;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 99999 !important;
      color: var(--text-black);
    }

    .modal-overlay.active { 
      display: flex !important; 
    }

    .modal-content {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .driver-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-black);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .driver-seats-display {
      text-align: center;
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--text-black);
    }

    .driver-adjust-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .btn-driver-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--text-black);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-driver-circle:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .manual-entry-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .manual-entry-group label {
      font-size: 0.85rem;
      color: var(--text-black);
      text-transform: uppercase;
      font-weight: 800;
    }

    .manual-input-row {
      display: flex;
      gap: 8px;
    }

    .manual-input-row input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid var(--text-black);
      background: #FFFFFF;
      color: var(--text-black);
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
    }

    .btn-update {
      background: var(--btn-bg);
      color: var(--btn-text);
      padding: 0 16px;
      border-radius: 8px;
      border: 2px solid var(--text-black);
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Passenger Facing App Container -->
  <div class="app-container">
    <div class="header" id="header-trigger">
      <h1>Seat Requests</h1>
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Date & Destination Badges -->
    <div class="info-badges-row">
      <div class="date-badge">
        <span>📅 Journey Date:</span>
        <span id="journey-date-display">Today</span>
      </div>
      <div class="date-badge">
        <span>📍 Destination:</span>
        <span id="destination-display">Not Set</span>
      </div>
    </div>

    <div class="seats-card" id="seats-card">
      <div class="seats-count" id="seats-count">6</div>
      <div class="seats-label" id="seats-label">SEATS AVAILABLE</div>
    </div>

    <div class="passenger-controls">
      <div class="counter-row" id="counter-row">
        <span>I want</span>
        <button class="btn-circle" id="btn-pass-minus">−</button>
        <span id="pass-request-count" style="font-size: 1.3rem;">1</span>
        <button class="btn-circle" id="btn-pass-plus">+</button>
        <span>seat(s)</span>
      </div>

      <button class="btn" id="btn-whatsapp">
        Request via WhatsApp
      </button>

      <a class="btn" id="btn-call" href="tel:+917006208554">
        Call Driver
      </a>
    </div>

    <div class="qr-section">
      <div class="qr-card">
        <img id="qr-image" src="" alt="App QR Code" />
      </div>
      <button class="btn" id="btn-share-qr">
        Share App via WhatsApp
      </button>
    </div>
  </div>

  <!-- Separate Hidden Fullscreen Driver Overlay -->
  <div class="modal-overlay" id="driver-modal">
    <div class="modal-content">
      <div class="driver-title">Driver Control Panel</div>

      <div class="manual-entry-group">
        <label for="manual-phone-input">Driver Mobile Number</label>
        <div class="manual-input-row">
          <input type="tel" id="manual-phone-input" placeholder="7006208554" />
        </div>
      </div>

      <div class="manual-entry-group">
        <label for="manual-date-input">Journey Date</label>
        <div class="manual-input-row">
          <input type="date" id="manual-date-input" />
        </div>
      </div>

      <div class="manual-entry-group">
        <label for="manual-destination-input">Destination</label>
        <div class="manual-input-row">
          <input type="text" id="manual-destination-input" placeholder="e.g. Srinagar" />
        </div>
      </div>

      <div class="driver-seats-display" id="driver-seats-count">6</div>

      <div class="driver-adjust-row">
        <button class="btn-driver-circle" id="btn-driver-minus">−</button>
        <button class="btn-driver-circle" id="btn-driver-plus">+</button>
      </div>

      <div class="manual-entry-group">
        <label for="manual-seat-input">Set Available Seats</label>
        <div class="manual-input-row">
          <input type="number" id="manual-seat-input" min="0" placeholder="0" />
          <button class="btn-update" id="btn-manual-update">UPDATE</button>
        </div>
      </div>

      <button class="btn" id="btn-driver-done" style="margin-top: 10px;">DONE</button>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBnFkW8eqSUuzxr9nD_R53oXvk2A4QaHSk",
      authDomain: "car-pooling-59699.firebaseapp.com",
      databaseURL: "https://car-pooling-59699-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "car-pooling-59699",
      storageBucket: "car-pooling-59699.firebasestorage.app",
      messagingSenderId: "542955477260",
      appId: "1:542955477260:web:e47c0d714ae6f418d5d129",
      measurementId: "G-NDN93Y1P8E"
    };

    // Initialize Firebase Realtime Sync Engine
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const stateRef = db.ref("seat_app_state");

    let driverPhone = "+917006208554";
    let availableSeats = 6;
    let journeyDate = new Date().toISOString().split('T')[0];
    let destination = "Not Set";
    let requestedSeats = 1;

    const headerTrigger = document.getElementById('header-trigger');
    const progressBar = document.getElementById('progress-bar');
    const journeyDateDisplay = document.getElementById('journey-date-display');
    const destinationDisplay = document.getElementById('destination-display');
    const seatsCard = document.getElementById('seats-card');
    const seatsCountDisplay = document.getElementById('seats-count');
    const seatsLabelDisplay = document.getElementById('seats-label');

    const counterRow = document.getElementById('counter-row');
    const passMinusBtn = document.getElementById('btn-pass-minus');
    const passPlusBtn = document.getElementById('btn-pass-plus');
    const passRequestCount = document.getElementById('pass-request-count');
    const whatsappBtn = document.getElementById('btn-whatsapp');
    const callBtn = document.getElementById('btn-call');

    const qrImage = document.getElementById('qr-image');
    const shareQrBtn = document.getElementById('btn-share-qr');

    const driverModal = document.getElementById('driver-modal');
    const driverSeatsCount = document.getElementById('driver-seats-count');
    const driverMinusBtn = document.getElementById('btn-driver-minus');
    const driverPlusBtn = document.getElementById('btn-driver-plus');
    const manualPhoneInput = document.getElementById('manual-phone-input');
    const manualDateInput = document.getElementById('manual-date-input');
    const manualDestinationInput = document.getElementById('manual-destination-input');
    const manualSeatInput = document.getElementById('manual-seat-input');
    const manualUpdateBtn = document.getElementById('btn-manual-update');
    const driverDoneBtn = document.getElementById('btn-driver-done');

    function init() {
      setupQRCode();

      // Realtime listener syncs state instantly across all connected devices
      stateRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          if (typeof data.seats === 'number') availableSeats = data.seats;
          if (data.date) journeyDate = data.date;
          if (data.phone) driverPhone = data.phone;
          if (data.destination) destination = data.destination;
        } else {
          pushStateToCloud();
        }
        manualPhoneInput.value = driverPhone;
        manualDateInput.value = journeyDate;
        manualDestinationInput.value = destination === "Not Set" ? "" : destination;
        updateUI();
      });
    }

    function pushStateToCloud() {
      stateRef.set({
        seats: availableSeats,
        date: journeyDate,
        phone: driverPhone,
        destination: destination
      });
    }

    function updateUI() {
      const cleanPhone = driverPhone.replace(/[^0-9+]/g, '');
      callBtn.href = `tel:${cleanPhone}`;

      if (journeyDate) {
        const [year, month, day] = journeyDate.split('-');
        const formattedDate = new Date(year, month - 1, day).toLocaleDateString(undefined, {
          weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
        });
        journeyDateDisplay.textContent = formattedDate;
      }

      destinationDisplay.textContent = destination || "Not Set";

      seatsCountDisplay.textContent = availableSeats;
      driverSeatsCount.textContent = availableSeats;
      manualSeatInput.value = availableSeats;

      if (requestedSeats > availableSeats) {
        requestedSeats = Math.max(1, availableSeats);
      }
      passRequestCount.textContent = requestedSeats;

      if (availableSeats <= 0) {
        seatsCard.classList.add('booked');
        seatsCountDisplay.textContent = "";
        seatsLabelDisplay.textContent = "FULLY BOOKED - NO SEATS AVAILABLE";
        
        counterRow.style.display = 'none';
        whatsappBtn.disabled = true;
        whatsappBtn.textContent = "Fully Booked";
        driverMinusBtn.disabled = true;
      } else {
        seatsCard.classList.remove('booked');
        seatsLabelDisplay.textContent = availableSeats === 1 ? "SEAT AVAILABLE" : "SEATS AVAILABLE";
        
        counterRow.style.display = 'flex';
        whatsappBtn.disabled = false;
        whatsappBtn.textContent = "Request via WhatsApp";
        driverMinusBtn.disabled = false;
      }

      passMinusBtn.disabled = (requestedSeats <= 1);
      passPlusBtn.disabled = (requestedSeats >= availableSeats);
    }

    passMinusBtn.addEventListener('click', () => {
      if (requestedSeats > 1) {
        requestedSeats--;
        updateUI();
      }
    });

    passPlusBtn.addEventListener('click', () => {
      if (requestedSeats < availableSeats) {
        requestedSeats++;
        updateUI();
      }
    });

    whatsappBtn.addEventListener('click', () => {
      if (availableSeats <= 0) return;
      const formattedDate = journeyDateDisplay.textContent;
      const destText = destination !== "Not Set" ? ` to ${destination}` : '';
      const text = encodeURIComponent(`Hi! I would like to request ${requestedSeats} seat(s) for the journey on ${formattedDate}${destText}.`);
      const cleanPhone = driverPhone.replace(/[^0-9]/g, '');
      window.open(`https://wa.me/${cleanPhone}?text=${text}`, '_blank');
    });

    function setupQRCode() {
      const currentUrl = encodeURIComponent(window.location.href);
      qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${currentUrl}`;
    }

    shareQrBtn.addEventListener('click', () => {
      const shareText = encodeURIComponent(`Check seat availability and request seats for ${journeyDateDisplay.textContent} here: ${window.location.href}`);
      window.open(`https://wa.me/?text=${shareText}`, '_blank');
    });

    let pressTimer;
    let progressInterval;
    let progress = 0;

    function startPress() {
      progress = 0;
      progressBar.style.width = '0%';
      
      progressInterval = setInterval(() => {
        progress += 3.33;
        progressBar.style.width = `${progress}%`;
      }, 100);

      pressTimer = setTimeout(() => {
        clearInterval(progressInterval);
        progressBar.style.width = '0%';
        openDriverModal();
      }, 3000);
    }

    function cancelPress() {
      clearTimeout(pressTimer);
      clearInterval(progressInterval);
      progressBar.style.width = '0%';
    }

    headerTrigger.addEventListener('mousedown', startPress);
    headerTrigger.addEventListener('mouseup', cancelPress);
    headerTrigger.addEventListener('mouseleave', cancelPress);

    headerTrigger.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startPress();
    });
    headerTrigger.addEventListener('touchend', cancelPress);

    function openDriverModal() {
      driverModal.classList.add('active');
    }

    driverDoneBtn.addEventListener('click', () => {
      driverModal.classList.remove('active');
    });

    manualPhoneInput.addEventListener('change', (e) => {
      if (e.target.value) {
        driverPhone = e.target.value;
        pushStateToCloud();
      }
    });

    manualDateInput.addEventListener('change', (e) => {
      if (e.target.value) {
        journeyDate = e.target.value;
        pushStateToCloud();
      }
    });

    manualDestinationInput.addEventListener('change', (e) => {
      destination = e.target.value.trim() || "Not Set";
      pushStateToCloud();
    });

    driverMinusBtn.addEventListener('click', () => {
      if (availableSeats > 0) {
        availableSeats--;
        pushStateToCloud();
      }
    });

    driverPlusBtn.addEventListener('click', () => {
      availableSeats++;
      pushStateToCloud();
    });

    manualUpdateBtn.addEventListener('click', () => {
      const val = parseInt(manualSeatInput.value);
      if (!isNaN(val) && val >= 0) {
        availableSeats = val;
        pushStateToCloud();
      }
    });

    init();
  </script>
</body>
</html>
