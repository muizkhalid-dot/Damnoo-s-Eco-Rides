<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Request App</title>
  <style>
    :root {
      --bg-yellow: #FFCC00;
      --text-black: #000000;
      --btn-bg: #000000;
      --btn-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-yellow);
      color: var(--text-black);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-yellow);
      border-radius: 20px;
      border: 3px solid var(--text-black);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      height: fit-content;
    }

    .header {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: var(--bg-yellow);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--text-black);
    }

    .header h1 {
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: var(--text-black);
      text-transform: uppercase;
      font-weight: 800;
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 6px;
      background: var(--text-black);
      width: 0%;
      transition: width 0.1s linear;
    }

    .date-badge {
      text-align: center;
      background: var(--bg-yellow);
      color: var(--text-black);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 800;
      border: 2px solid var(--text-black);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .seats-card {
      text-align: center;
      padding: 24px 16px;
      border-radius: 16px;
      background: var(--bg-yellow);
      border: 3px solid var(--text-black);
      transition: all 0.3s ease;
    }

    .seats-count {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
      color: var(--text-black);
    }

    .seats-label {
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-black);
    }

    .seats-card.booked {
      border-color: var(--text-black);
      background: #fef08a;
    }

    .booked .seats-label {
      color: #b45309;
      font-size: 1.1rem;
    }

    .passenger-controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .counter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-weight: 800;
      color: var(--text-black);
    }

    .btn-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--text-black);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-circle:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--text-black);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 0.1s ease;
    }

    .btn:active { transform: scale(0.98); }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .qr-section {
      text-align: center;
      border-top: 2px solid var(--text-black);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .qr-card {
      background: #FFFFFF;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid var(--text-black);
      display: inline-block;
    }

    .qr-card img {
      display: block;
      width: 140px;
      height: 140px;
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-yellow);
      border-radius: 20px;
      border: 3px solid var(--text-black);
      padding: 24px;
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      color: var(--text-black);
    }

    .modal-overlay.active { display: flex; }

    .driver-title {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-black);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .driver-seats-display {
      text-align: center;
      font-size: 3rem;
      font-weight: 900;
      color: var(--text-black);
    }

    .driver-adjust-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .btn-driver-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid var(--text-black);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-driver-circle:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .manual-entry-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .manual-entry-group label {
      font-size: 0.85rem;
      color: var(--text-black);
      text-transform: uppercase;
      font-weight: 800;
    }

    .manual-input-row {
      display: flex;
      gap: 8px;
    }

    .manual-input-row input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid var(--text-black);
      background: #FFFFFF;
      color: var(--text-black);
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
    }

    .btn-update {
      background: var(--btn-bg);
      color: var(--btn-text);
      padding: 0 16px;
      border-radius: 8px;
      border: 2px solid var(--text-black);
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="header" id="header-trigger">
      <h1>Seat Requests</h1>
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="date-badge">
      <span>📅 Journey Date:</span>
      <span id="journey-date-display">Today</span>
    </div>

    <div class="seats-card" id="seats-card">
      <div class="seats-count" id="seats-count">6</div>
      <div class="seats-label" id="seats-label">SEATS AVAILABLE</div>
    </div>

    <div class="passenger-controls">
      <div class="counter-row" id="counter-row">
        <span>I want</span>
        <button class="btn-circle" id="btn-pass-minus">−</button>
        <span id="pass-request-count" style="font-size: 1.3rem;">1</span>
        <button class="btn-circle" id="btn-pass-plus">+</button>
        <span>seat(s)</span>
      </div>

      <button class="btn" id="btn-whatsapp">
        Request via WhatsApp
      </button>

      <a class="btn" id="btn-call" href="tel:+917006208554">
        Call Driver
      </a>
    </div>

    <div class="qr-section">
      <div class="qr-card">
        <img id="qr-image" src="" alt="App QR Code" />
      </div>
      <button class="btn" id="btn-share-qr">
        Share App via WhatsApp
      </button>
    </div>

    <div class="modal-overlay" id="driver-modal">
      <div class="driver-title">Driver Control Panel</div>

      <div class="manual-entry-group">
        <label for="manual-phone-input">Driver Mobile Number</label>
        <div class="manual-input-row">
          <input type="tel" id="manual-phone-input" placeholder="7006208554" />
        </div>
      </div>

      <div class="manual-entry-group">
        <label for="manual-date-input">Journey Date</label>
        <div class="manual-input-row">
          <input type="date" id="manual-date-input" />
        </div>
      </div>

      <div class="driver-seats-display" id="driver-seats-count">6</div>

      <div class="driver-adjust-row">
        <button class="btn-driver-circle" id="btn-driver-minus">−</button>
        <button class="btn-driver-circle" id="btn-driver-plus">+</button>
      </div>

      <div class="manual-entry-group">
        <label for="manual-seat-input">Set Available Seats</label>
        <div class="manual-input-row">
          <input type="number" id="manual-seat-input" min="0" placeholder="0" />
          <button class="btn-update" id="btn-manual-update">UPDATE</button>
        </div>
      </div>

      <button class="btn" id="btn-driver-done" style="margin-top: 10px;">DONE</button>
    </div>

  </div>

  <script>
    // Live Cloud Sync Configuration (Free Public KV Store)
    const SYNC_URL = 'https://kvdb.io/8xQ9jKz7S9pL2N4mQ6vA1x/driver_seats_7006208554';

    let driverPhone = localStorage.getItem('driverPhone') || "+917006208554";
    let availableSeats = parseInt(localStorage.getItem('availableSeats')) || 6;
    let journeyDate = localStorage.getItem('journeyDate') || new Date().toISOString().split('T')[0];
    let requestedSeats = 1;

    const headerTrigger = document.getElementById('header-trigger');
    const progressBar = document.getElementById('progress-bar');
    const journeyDateDisplay = document.getElementById('journey-date-display');
    const seatsCard = document.getElementById('seats-card');
    const seatsCountDisplay = document.getElementById('seats-count');
    const seatsLabelDisplay = document.getElementById('seats-label');

    const counterRow = document.getElementById('counter-row');
    const passMinusBtn = document.getElementById('btn-pass-minus');
    const passPlusBtn = document.getElementById('btn-pass-plus');
    const passRequestCount = document.getElementById('pass-request-count');
    const whatsappBtn = document.getElementById('btn-whatsapp');
    const callBtn = document.getElementById('btn-call');

    const qrImage = document.getElementById('qr-image');
    const shareQrBtn = document.getElementById('btn-share-qr');

    const driverModal = document.getElementById('driver-modal');
    const driverSeatsCount = document.getElementById('driver-seats-count');
    const driverMinusBtn = document.getElementById('btn-driver-minus');
    const driverPlusBtn = document.getElementById('btn-driver-plus');
    const manualPhoneInput = document.getElementById('manual-phone-input');
    const manualDateInput = document.getElementById('manual-date-input');
    const manualSeatInput = document.getElementById('manual-seat-input');
    const manualUpdateBtn = document.getElementById('btn-manual-update');
    const driverDoneBtn = document.getElementById('btn-driver-done');

    function init() {
      manualPhoneInput.value = driverPhone;
      manualDateInput.value = journeyDate;
      updateUI();
      setupQRCode();
      fetchCloudState();
      setInterval(fetchCloudState, 4000); // Check live updates every 4 seconds
    }

    // Push Driver changes to cloud so passengers see it
    async function pushCloudState() {
      try {
        await fetch(SYNC_URL, {
          method: 'POST',
          body: JSON.stringify({ seats: availableSeats, date: journeyDate, phone: driverPhone })
        });
      } catch (e) {
        console.log("Cloud sync save error:", e);
      }
    }

    // Pull Driver updates to passenger devices
    async function fetchCloudState() {
      try {
        const res = await fetch(SYNC_URL);
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.seats === 'number') {
            availableSeats = data.seats;
            if (data.date) journeyDate = data.date;
            if (data.phone) driverPhone = data.phone;
            updateUI();
          }
        }
      } catch (e) {
        console.log("Cloud sync fetch error:", e);
      }
    }

    function updateUI() {
      localStorage.setItem('availableSeats', availableSeats);
      localStorage.setItem('journeyDate', journeyDate);
      localStorage.setItem('driverPhone', driverPhone);

      const cleanPhone = driverPhone.replace(/[^0-9+]/g, '');
      callBtn.href = `tel:${cleanPhone}`;

      if (journeyDate) {
        const [year, month, day] = journeyDate.split('-');
        const formattedDate = new Date(year, month - 1, day).toLocaleDateString(undefined, {
          weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
        });
        journeyDateDisplay.textContent = formattedDate;
      }

      seatsCountDisplay.textContent = availableSeats;
      driverSeatsCount.textContent = availableSeats;

      if (requestedSeats > availableSeats) {
        requestedSeats = Math.max(1, availableSeats);
      }
      passRequestCount.textContent = requestedSeats;

      if (availableSeats <= 0) {
        seatsCard.classList.add('booked');
        seatsCountDisplay.textContent = "";
        seatsLabelDisplay.textContent = "FULLY BOOKED - NO SEATS AVAILABLE";
        
        counterRow.style.display = 'none';
        whatsappBtn.disabled = true;
        whatsappBtn.textContent = "Fully Booked";
        driverMinusBtn.disabled = true;
      } else {
        seatsCard.classList.remove('booked');
        seatsLabelDisplay.textContent = availableSeats === 1 ? "SEAT AVAILABLE" : "SEATS AVAILABLE";
        
        counterRow.style.display = 'flex';
        whatsappBtn.disabled = false;
        whatsappBtn.textContent = "Request via WhatsApp";
        driverMinusBtn.disabled = false;
      }

      passMinusBtn.disabled = (requestedSeats <= 1);
      passPlusBtn.disabled = (requestedSeats >= availableSeats);
    }

    passMinusBtn.addEventListener('click', () => {
      if (requestedSeats > 1) {
        requestedSeats--;
        updateUI();
      }
    });

    passPlusBtn.addEventListener('click', () => {
      if (requestedSeats < availableSeats) {
        requestedSeats++;
        updateUI();
      }
    });

    whatsappBtn.addEventListener('click', () => {
      if (availableSeats <= 0) return;
      const formattedDate = journeyDateDisplay.textContent;
      const text = encodeURIComponent(`Hi! I would like to request ${requestedSeats} seat(s) for the journey on ${formattedDate}.`);
      const cleanPhone = driverPhone.replace(/[^0-9]/g, '');
      window.open(`https://wa.me/${cleanPhone}?text=${text}`, '_blank');
    });

    function setupQRCode() {
      const currentUrl = encodeURIComponent(window.location.href);
      qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${currentUrl}`;
    }

    shareQrBtn.addEventListener('click', () => {
      const shareText = encodeURIComponent(`Check seat availability and request seats for ${journeyDateDisplay.textContent} here: ${window.location.href}`);
      window.open(`https://wa.me/?text=${shareText}`, '_blank');
    });

    let pressTimer;
    let progressInterval;
    let progress = 0;

    function startPress() {
      progress = 0;
      progressBar.style.width = '0%';
      
      progressInterval = setInterval(() => {
        progress += 3.33;
        progressBar.style.width = `${progress}%`;
      }, 100);

      pressTimer = setTimeout(() => {
        clearInterval(progressInterval);
        progressBar.style.width = '0%';
        openDriverModal();
      }, 3000);
    }

    function cancelPress() {
      clearTimeout(pressTimer);
      clearInterval(progressInterval);
      progressBar.style.width = '0%';
    }

    headerTrigger.addEventListener('mousedown', startPress);
    headerTrigger.addEventListener('mouseup', cancelPress);
    headerTrigger.addEventListener('mouseleave', cancelPress);

    headerTrigger.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startPress();
    });
    headerTrigger.addEventListener('touchend', cancelPress);

    function openDriverModal() {
      driverModal.classList.add('active');
    }

    driverDoneBtn.addEventListener('click', () => {
      driverModal.classList.remove('active');
    });

    manualPhoneInput.addEventListener('change', (e) => {
      if (e.target.value) {
        driverPhone = e.target.value;
        updateUI();
        pushCloudState();
      }
    });

    manualDateInput.addEventListener('change', (e) => {
      if (e.target.value) {
        journeyDate = e.target.value;
        updateUI();
        pushCloudState();
      }
    });

    driverMinusBtn.addEventListener('click', () => {
      if (availableSeats > 0) {
        availableSeats--;
        updateUI();
        pushCloudState();
      }
    });

    driverPlusBtn.addEventListener('click', () => {
      availableSeats++;
      updateUI();
      pushCloudState();
    });

    manualUpdateBtn.addEventListener('click', () => {
      const val = parseInt(manualSeatInput.value);
      if (!isNaN(val) && val >= 0) {
        availableSeats = val;
        updateUI();
        pushCloudState();
      }
    });

    init();
  </script>
</body>
</html>
